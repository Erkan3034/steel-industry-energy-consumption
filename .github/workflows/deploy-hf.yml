name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    paths: ["app/**", "src/**", "models/**", "hf_space/**", "hf_model/**", ".github/workflows/deploy-hf.yml"]
  workflow_dispatch:

env:
  HF_SPACE: erkanturgut/steel-energy-predictor
  HF_MODEL: erkanturgut/steel-energy-consumption-ridge

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.30"
      - name: Upload Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN secret not set, skipping."; exit 0; fi
          python - <<'EOF'
          import os, shutil, tempfile
          from huggingface_hub import HfApi

          stage = tempfile.mkdtemp()
          for d in ("src", "models"):
              shutil.copytree(d, f"{stage}/{d}", ignore=shutil.ignore_patterns("__pycache__"))
          os.makedirs(f"{stage}/app")
          shutil.copy("app/gradio_app.py", f"{stage}/app/gradio_app.py")
          for f in ("LICENSE", "MODEL_CARD.md"):
              shutil.copy(f, stage)
          # Space-specific config and slim requirements (Gradio comes from sdk_version)
          shutil.copy("hf_space/README.md", f"{stage}/README.md")
          shutil.copy("hf_space/requirements.txt", f"{stage}/requirements.txt")

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path=stage,
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              commit_message=f"Sync from GitHub {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["*.py", "*.pkl", "*.md", "*.txt", "Dockerfile"],
          )
          EOF
      - name: Upload model repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN secret not set, skipping."; exit 0; fi
          python - <<'EOF'
          import os, shutil, tempfile
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_MODEL"]
          api.create_repo(repo, repo_type="model", exist_ok=True)

          stage = tempfile.mkdtemp()
          shutil.copy("models/steel_energy_pipeline_v1.pkl", stage)
          shutil.copy("hf_model/README.md", f"{stage}/README.md")
          shutil.copy("LICENSE", stage)

          api.upload_folder(
              folder_path=stage,
              repo_id=repo,
              repo_type="model",
              commit_message=f"Sync from GitHub {os.environ['GITHUB_SHA'][:7]}",
          )
          EOF
